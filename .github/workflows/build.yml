
name: Build Pocket Budget APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-34"
          sdkmanager --install "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unzip project
        shell: bash
        run: |
          mkdir -p work

          if [ -f "project.zip" ]; then
            unzip -q project.zip -d work
          elif [ -f "pocketbudget-widgets.zip" ]; then
            unzip -q pocketbudget-widgets.zip -d work
          else
            echo "ERROR: Project ZIP file not found."
            echo "Add project.zip or pocketbudget-widgets.zip to the repository root."
            exit 1
          fi

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          PROJECT_DIR="$(find work -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle settings file not found."
            find work -maxdepth 5 -type f | head -n 100
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project at: $PROJECT_DIR"

      - name: Build debug APK
        run: |
          gradle -p "${{ steps.project.outputs.dir }}" \
            assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketBudget-debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
