name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Avoid installing the obsolete Android SDK "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unzip project
        run: unzip -q project.zip -d work

      - name: Build debug APK
        run: gradle -p work/GlassWidgets assembleDebug --no-daemon

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassWidgets-debug-apk
          path: work/GlassWidgets/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp work/GlassWidgets/app/build/outputs/apk/debug/app-debug.apk GlassWidgets.apk
          gh release create "build-${{ github.run_number }}" GlassWidgets.apk \
            --repo "${{ github.repository }}" \
            --title "Glass Widgets build ${{ github.run_number }}" \
            --notes "Install GlassWidgets.apk on your phone." || {
              echo "Release creation failed. The APK is still available in the workflow artifacts."
              exit 1
            }
