name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          mkdir -p work
          unzip -q project.zip -d work

      - name: Build debug APK with Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      
      - name: Run Build
        run: |
          PROJECT_DIR=$(find work -name "build.gradle.kts" -maxdepth 3 | xargs dirname)
          echo "Found project directory at: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH=$(find work -name "app-debug.apk" | head -n 1)
          cp "$APK_PATH" GlassWidgets.apk
          
          TAG="build-${{ github.run_number }}"
          
          # Clean up any existing tag/release conflicts
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes || true
          git push origin --delete "$TAG" || true

          # Create release and upload APK
          gh release create "$TAG" GlassWidgets.apk \
            --repo "${{ github.repository }}" \
            --title "Glass Widgets build ${{ github.run_number }}" \
            --notes "Install GlassWidgets.apk on your phone."
