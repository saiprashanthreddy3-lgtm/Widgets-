name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          mkdir -p work
          unzip -q project.zip -d work

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          PROJECT_DIR=$(find work -name "build.gradle.kts" -maxdepth 3 | xargs dirname)
          echo "Found project directory at: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH=$(find work -name "app-debug.apk" | head -n 1)
          cp "$APK_PATH" GlassWidgets.apk
          gh release create "build-${{ github.run_number }}" GlassWidgets.apk \
            --repo "${{ github.repository }}" \
            --title "Glass Widgets build ${{ github.run_number }}" \
            --notes "Install GlassWidgets.apk on your phone." \
            --clobber
            
