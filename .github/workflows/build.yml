name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: unzip -q project.zip -d work

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x work/GlassWidgets/gradlew || true
          gradle -p work/GlassWidgets assembleDebug --no-daemon

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp work/GlassWidgets/app/build/outputs/apk/debug/app-debug.apk GlassWidgets.apk
          gh release create "build-${{ github.run_number }}" GlassWidgets.apk \
            --repo "${{ github.repository }}" \
            --title "Glass Widgets build ${{ github.run_number }}" \
            --notes "Install GlassWidgets.apk on your phone." \
            --clobber
            
